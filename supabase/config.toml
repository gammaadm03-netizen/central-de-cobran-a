# The gateway authenticates usernames before a user JWT exists. Every authenticated
# operation validates its Bearer token against Supabase Auth itself.
[functions.auth-gateway]
verify_jwt = false

# This endpoint validates the exact Bearer token with Auth and the approved
# application session before reading or parsing a file. Do not disable RLS.
[functions.payables-import]
verify_jwt = false

[functions.receivables-import]
verify_jwt = false

# Reference originals are private; this gateway validates Auth, the approved
# session and import permissions before reading or converting reference chunks.
[functions.collection-reference-import]
verify_jwt = false
